<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ugly Avatar</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <!--
    Face generator from "ugly-avatar" by Xuan Tang (txstc55)
    https://github.com/txstc55/ugly-avatar
    Licensed under CC BY-NC 4.0 (https://creativecommons.org/licenses/by-nc/4.0/);
    ported to plain JavaScript, see js/ugly-avatar/ for details.
  -->
</head>
<body>
  <noscript>
    <strong>Sorry, this page needs JavaScript enabled to draw a face.</strong>
  </noscript>
  <div class="container">
    <div id="face" class="face"></div>
    <button id="another" type="button">ANOTHER</button>
    <button id="download" type="button">DOWNLOAD</button>
  </div>

  <script type="module">
    import { mount } from "./js/ugly-avatar/face_generator.js";
    mount({
      holder: document.getElementById("face"),
      anotherButton: document.getElementById("another"),
      downloadButton: document.getElementById("download"),
    });
  </script>
</body>
</html>
